<style>
/* Preview of petrogrid.xyz "/" — a faithful port of pitch-layout.ts + hex-content.tsx. Hex lattice ground, regions cut from cells. */
:root{
  --background:#ffffff; --foreground:#0a0a0a; --primary:#1764d6; --primary-foreground:#ffffff;
  --muted-foreground:#5f656c; --grid-line:#e4e7ea; --alarm:#d1372f;
  --chrome:#0a0a0a; --chrome-fg:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--background);color:var(--foreground)}
body{font-family:"Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
#stage{position:relative}
#stage .layer-grid{position:relative;z-index:0}
#stage .layer-content{position:absolute;inset:0;z-index:2}
.hex-traffic{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none}
#stage svg{display:block}
.lattice polygon{fill:none;stroke:var(--grid-line);stroke-width:1}

/* site header (approximation: HexScroll/logo files were not provided) */
.brand-name{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:700;font-size:20px;fill:var(--foreground)}
.brand-name .g{fill:var(--primary)}
@media (max-width:599px){.brand-name{font-size:17px}}
/* three-part page structure */
.hx-mark .hx-fill { fill: var(--primary); fill-opacity: 1; }
.hx-mark .hx-edge { stroke: none; }
.hx-figure .hx-fill { fill: var(--background); fill-opacity: 1; }
.hx-figure .hx-edge { stroke: var(--muted-foreground); stroke-width: 1.25; stroke-dasharray: 4 4; }
.hx-text.hx-text-top { justify-content: flex-start; }
.hx-body.hx-lede { margin-top: 8px; max-width: 62ch; }
.hx-h3.hx-subhead { margin: 0; }
.hx-h3.hx-step-title { margin-top: 0; }
.hx-figure { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.hx-figure > span { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); }
.hx-figure > em { font-style: normal; font-size: 14px; color: var(--muted-foreground); }
.hx-tier-phone .hx-body.hx-lede, .hx-tier-tablet .hx-body.hx-lede { margin-top: 10px; }
.hx-eyebrow.hx-tag { color: var(--muted-foreground); }
.hx-site { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.hx-site b { font-family: "Archivo", sans-serif; font-stretch: 112%; font-weight: 700; font-size: 15px; line-height: 1.2; color: var(--foreground); }
.hx-site span { font-size: 13px; line-height: 1.35; color: var(--muted-foreground); }

.hx-body.hx-note { margin-top: 4px; font-size: 14px; }
.hx-h1 + .hx-body { margin-top: -2px; }

/* Supply-chain waterfall */
.sm-edge { fill: none; stroke: var(--muted-foreground); stroke-opacity: .35; stroke-width: 1.25; transition: stroke .15s, stroke-opacity .15s; }
.sm-edge.is-on { stroke: var(--primary); stroke-opacity: 1; stroke-width: 2; }
.sm-node { cursor: pointer; outline: none; }
.sm-badge { fill: var(--background); stroke: var(--foreground); stroke-width: 1.5; transition: fill .15s, stroke .15s; }
.sm-node.is-linked .sm-badge { stroke: var(--primary); stroke-width: 2; }
.sm-node:focus-visible .sm-badge { stroke: var(--primary); stroke-width: 3; }
/* Hover: invert to black and blue (ink strokes turn white, blue stays blue) */
.sm-node.is-hot .sm-badge { fill: var(--foreground); }
.sm-node.is-hot .sm-icon [stroke="#0a0a0a"] { stroke: var(--background); }
.sm-node.is-hot .sm-icon [fill="#0a0a0a"] { fill: var(--background); }
.sm-label { font-family: "Instrument Sans", sans-serif; font-weight: 600; font-size: 11px; fill: var(--foreground); pointer-events: none; }
.hx-tier-phone .sm-label { font-size: 10px; }

/* Site pop-up: a pointy-top hexagon; the text sits in the rectangle inscribed in it */
.sd-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--background) 72%, transparent); backdrop-filter: blur(2px); animation: sd-fade .15s ease-out; }
.sd-hex {
  --hw: min(94vw, 88svh * 0.866, 680px);   /* width */
  --hh: calc(var(--hw) / 0.866);            /* height: a regular hexagon */
  --tip: calc(var(--hw) * 0.2887);          /* height of the top and bottom points (30° slopes) */
  position: relative; width: var(--hw); height: var(--hh); isolation: isolate; animation: sd-pop .18s ease-out;
}
.sd-hex::before, .sd-hex::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  clip-path: polygon(50% 0, 100% var(--tip), 100% calc(100% - var(--tip)), 50% 100%, 0 calc(100% - var(--tip)), 0 var(--tip));
}
.sd-hex::before { background: var(--foreground); }
.sd-hex::after { inset: 2px; background: var(--background); }
/* Header sits in the top point, body fills the straight-sided middle, scroll hint sits in the bottom point. */
.sd-frame { position: absolute; left: 8%; right: 8%; top: calc(var(--tip) * 0.38); bottom: calc(var(--tip) * 0.86); display: flex; flex-direction: column; }
.sd-hex:focus { outline: none; }
.sd-head { flex: none; text-align: center; font-family: "Instrument Sans", sans-serif; font-size: 13px; line-height: 1.4; padding-bottom: 12px; border-bottom: 1px solid var(--foreground); margin: 0 6%; }
.sd-icon { display: block; margin: 0 auto 8px; width: 30px; height: 30px; }
.sd-body {
  flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain;
  padding: 4px 6px 24px 2px;
  -webkit-mask-image: linear-gradient(transparent, #000 12px, #000 calc(100% - 28px), transparent);
          mask-image: linear-gradient(transparent, #000 12px, #000 calc(100% - 28px), transparent);
  font-family: "Instrument Sans", sans-serif; font-size: 13px; line-height: 1.45; color: var(--foreground);
}
.sd-more { position: absolute; left: 50%; bottom: calc(var(--tip) * 0.56); transform: translateX(-50%); border: 0; background: none; cursor: pointer;
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); transition: opacity .2s; }
.sd-more.is-done { opacity: 0; pointer-events: none; }
/* Close: a small hex button in the empty corner beside the top point. */
.sd-close { position: absolute; right: 2%; top: calc(var(--tip) * 0.12); width: 40px; height: 46px; border: 0; padding: 0; background: none; cursor: pointer; isolation: isolate;
  font-size: 22px; line-height: 1; color: var(--foreground); }
.sd-close::before, .sd-close::after { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.sd-close::before { background: var(--foreground); }
.sd-close::after { inset: 1.5px; background: var(--background); }
.sd-close:hover, .sd-close:focus-visible { color: #fff; outline: none; }
.sd-close:hover::before, .sd-close:focus-visible::before, .sd-close:hover::after, .sd-close:focus-visible::after { background: var(--primary); }
.sd-body section { margin-top: 16px; }
.sd-body h4 { margin: 0 0 6px; font-family: "Archivo", sans-serif; font-stretch: 112%; font-weight: 700; font-size: 14px; }
.sd-body p, .sd-head p { margin: 0 0 4px; }
.sd-kind { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); }
.sd-name { margin: 4px 0 2px; font-family: "Archivo", sans-serif; font-stretch: 112%; font-weight: 700; font-size: 22px; line-height: 1.15; }
.sd-does { color: var(--muted-foreground); }
.sd-about { margin-top: 12px !important; }
.sd-links { margin-top: 8px; }
.sd-links p { margin: 0; font-size: 12.5px; color: var(--muted-foreground); }
.sd-links b { color: var(--foreground); margin-right: 4px; }
.sd-eq { font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.5; }
.sd-basis { font-size: 11.5px; color: var(--muted-foreground); }
.sd-spec { font-size: 12.5px; }
.sd-io { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.sd-line { font-size: 12.5px; color: var(--muted-foreground); }
.sd-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 6px; }
.sd-table th { text-align: left; font-weight: 600; border-bottom: 1px solid var(--foreground); padding: 2px 4px 2px 0; }
.sd-table td { border-bottom: 1px solid var(--grid-line); padding: 2px 4px 2px 0; vertical-align: top; }
.sd-num { text-align: right !important; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", monospace; }
.sd-units td:last-child { font-size: 11.5px; color: var(--muted-foreground); }
.sd-scroll { overflow-x: auto; }
.hx-h3.hx-q { margin: 0; width: 100%; text-align: center; font-size: 17px; text-wrap: balance; }
/* Stat blobs: number, line, then the source set apart in mono under a hairline */
.hx-stat { gap: 6px; }
.hx-stat em { font-family: "IBM Plex Mono", monospace; font-size: 9px; white-space: nowrap; letter-spacing: 0; text-transform: none; opacity: 1; padding-top: 5px; border-top: 1px solid var(--grid-line); }

/* Model charts (pop-up and How-it-works figures): ink lines, one blue accent, a baseline only. */
.mc { margin: 8px 0 10px; min-width: 0; }
.mc svg { display: block; width: 100%; max-width: 460px; height: auto; overflow: visible; touch-action: pan-y; }
.mc-base { stroke: var(--foreground); stroke-width: 1; }
.mc-tick { stroke: var(--foreground); stroke-width: 1; }
.mc-t { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--muted-foreground); }
.mc-ax { fill: var(--foreground); }
.mc-rule { stroke: var(--muted-foreground); stroke-width: 1; stroke-dasharray: 3 3; }
.mc-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mc-blue { stroke: var(--primary); }
.mc-ink { stroke: var(--foreground); }
.mc-cross, .mc-dot { opacity: 0; transition: opacity .12s; }
.mc.is-on .mc-cross, .mc.is-on .mc-dot { opacity: 1; }
.mc-cross { stroke: var(--foreground); stroke-width: 1; }
.mc-dot { fill: var(--background); stroke-width: 2; }
.mc-hit { fill: transparent; cursor: crosshair; }
.mc-read { min-height: 1.4em; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--foreground); text-align: left; }
.mc-legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 11.5px; color: var(--muted-foreground); margin: 0 0 4px !important; text-align: left; }
.mc-key { display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle; }
.mc-key-blue { background: var(--primary); }
.mc-key-ink { background: var(--foreground); }
.sd-body .mc svg { max-width: 360px; }

/* Step figures on the page */
.hx-figure.hx-figure-live { display: block; text-align: left; }
.mf { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.mf > .mc, .mf-row .mc { margin: 0; }
.mf > .mc svg { margin: 0 auto; }
.mf-row { display: grid; gap: 16px; align-items: end; }
.mf-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mf-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mf-counter { justify-content: center; }
.hx-tier-phone .mf-3, .hx-tier-phone .mf-2 { grid-template-columns: 1fr; gap: 4px; }
.hx-tier-phone .mf-row .mc svg { max-width: 280px; margin: 0 auto; }


/* One process, drawn (chlor-alkali) */
.pf { display: flex; flex-direction: column; gap: 6px; }
.pf-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.pf-tab { border: 1px solid var(--foreground); background: var(--background); color: var(--foreground); border-radius: 4px; padding: 4px 10px; font-family: "IBM Plex Mono", monospace; font-size: 11px; cursor: pointer; }
.pf-tab:hover { border-color: var(--primary); color: var(--primary); }
.pf-tab.is-on { background: var(--foreground); color: var(--background); }
.pf-tab:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.pf-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
.pf-svg { display: block; width: 100%; height: auto; margin: 0 auto; }
.pf-vert { display: none; }
.pf-svg-v { display: block; width: 100%; max-width: 320px; height: auto; margin: 0 auto; }
/* Too narrow for the left-to-right drawing (phones, tablets): switch to the top-to-bottom one. */
.pf { container-type: inline-size; }
@container (max-width: 759px) {
  .pf-scroll { display: none; }
  .pf-vert { display: block; }
  .pf-tabs { justify-content: center; }
}
@container (max-width: 480px) {
  .pf-tabs { display: grid; grid-template-columns: 1fr 1fr; }
  .pf-tab { padding: 6px; font-size: 10.5px; }
}
.pf-note-l { margin: 0; font-size: 12.5px; color: var(--muted-foreground); }
.pf-unit polygon { fill: #f0f2f4; stroke: var(--foreground); stroke-width: 1.25; }
.pf-unit.is-fault polygon { fill: #fbe9e8; stroke: var(--alarm); stroke-width: 1.5; }
.pf-tank polygon { fill: var(--background); stroke: #cdd2d7; stroke-width: 1; }
.pf-code { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 11px; fill: var(--foreground); }
.pf-trains { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--muted-foreground); }
.pf-unit.is-fault .pf-trains { fill: var(--alarm); font-weight: 600; }
.pf-name { font-family: "Instrument Sans", sans-serif; font-size: 12px; fill: var(--foreground); }
.pf-tname { font-weight: 600; }
.pf-note, .pf-pct { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--muted-foreground); }
.pf-track { fill: var(--grid-line); }
.pf-bar { fill: var(--primary); transition: width .3s; }
.pf-tank.is-fault .pf-bar, .pf-tank.is-fault .pf-track { fill: var(--alarm); }
.pf-tank.is-fault .pf-note { fill: var(--alarm); font-weight: 600; }
.pf-stream path { fill: none; stroke: #5f656c; stroke-width: 1.25; }
.pf-stream .pf-head { fill: #5f656c; stroke: none; }
.pf-stream text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--muted-foreground); }
.pf-stream .pf-v { fill: var(--foreground); font-weight: 600; }
.pf-stream.is-dead path { stroke: #cdd2d7; }
.pf-stream.is-dead .pf-head { fill: #cdd2d7; }
.pf-stream.is-dead text { fill: var(--muted-foreground); }

/* What a disruption costs */
.cf { margin: 0; }
.cf svg { display: block; width: 100%; max-width: 400px; height: auto; margin: 0 auto; overflow: visible; }
.cf-gap { fill: var(--alarm); fill-opacity: .12; stroke: none; }
.cf-cost { fill: var(--alarm); font-weight: 500; }
.cf-with { fill: var(--primary); }
.cf-bar rect { fill: var(--foreground); transition: opacity .15s; }
.cf-bar.is-neg rect { fill: var(--background); stroke: var(--foreground); stroke-width: 1.5; }
.cf-bar.is-total rect { fill: var(--alarm); }
.cf-wf:hover .cf-bar:not(.is-on) rect { opacity: .35; }
.cf-bar { cursor: default; }
.cf-step { stroke: var(--foreground); stroke-width: 1; stroke-dasharray: 2 2; }
.cf-red { color: var(--alarm); fill: var(--alarm); font-weight: 600; }
.cf-save { color: var(--muted-foreground); }
.cf-table { font-size: 12.5px; margin: 0 auto 4px; max-width: 640px; }
.cf-table td { vertical-align: top; }
.cf-mark { fill: var(--alarm); }
.cf-list { margin: 4px auto 0; padding-left: 20px; max-width: 480px; font-size: 12.5px; line-height: 1.45; }
.cf-list li { margin: 0 0 3px; }
.cf-limits { max-width: 560px; margin: 0 auto; }
.cf-limits .cf-list { max-width: none; }
.cf-lt { margin: 0 0 2px; font-family: "Archivo", sans-serif; font-stretch: 112%; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--foreground); padding-bottom: 3px; }
.cf-wf .mc-read { text-align: center; }

/* The engine clock */
.tk { display: flex; flex-direction: column; gap: 10px; font-family: "Instrument Sans", sans-serif; }
.tk-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.tk-clock { margin: 0; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted-foreground); min-width: 150px; }
.tk-time { font-family: "Archivo", sans-serif; font-stretch: 112%; font-size: 22px; color: var(--foreground); margin: 0 4px; }
.tk-strip { width: 164px; height: 44px; flex: none; }
.tk-cell polygon { fill: var(--background); stroke: var(--foreground); stroke-width: 1.25; transition: fill .15s; }
.tk-cell.tk-hour polygon { stroke-width: 2.25; }
.tk-cell text { font-family: "IBM Plex Mono", monospace; font-size: 9px; fill: var(--foreground); }
.tk-cell.is-now polygon { fill: var(--primary); stroke: var(--primary); }
.tk-cell.is-now text { fill: #fff; }
.tk-state { flex: 1; min-width: 220px; display: grid; gap: 3px; }
.tk-state p { margin: 0; display: grid; grid-template-columns: 70px 1fr 120px; align-items: center; gap: 8px; font-size: 11.5px; }
.tk-state span { color: var(--muted-foreground); }
.tk-state em { font-style: normal; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
.tk-state p:last-child { grid-template-columns: 70px 1fr; }
.tk-bar { display: block; height: 6px; border: 1px solid var(--foreground); border-radius: 3px; overflow: hidden; }
.tk-bar b { display: block; height: 100%; background: var(--primary); transition: width .3s; }
.tk-bar b.is-fault { background: var(--alarm); }
.tk-lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tk-lt { margin: 0 0 4px; font-family: "Archivo", sans-serif; font-stretch: 112%; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--foreground); padding-bottom: 3px; }
.tk-lt span { font-family: "IBM Plex Mono", monospace; font-weight: 400; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); margin-left: 6px; }
.tk-row { margin: 0; padding: 2px 0 2px 16px; position: relative; font-size: 12px; line-height: 1.35; color: var(--muted-foreground); transition: color .3s; }
.tk-row i { position: absolute; left: 0; top: 6px; width: 9px; height: 10px; background: var(--grid-line); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); transition: background .3s; }
.tk-row.is-fired { color: var(--foreground); }
.tk-row.is-fired i { background: var(--primary); animation: tk-flash .6s ease-out; }
.tk-row[data-row="stop"].is-fired i { background: var(--alarm); }
@keyframes tk-flash { from { transform: scale(1.6); } }
.hx-tier-phone .tk-lanes { grid-template-columns: 1fr; gap: 8px; }
.hx-tier-phone .tk-state p { grid-template-columns: 64px 1fr 92px; }
@media (prefers-reduced-motion: reduce) { .tk-row.is-fired i { animation: none; } .tk-bar b { transition: none; } }

@keyframes sd-pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sd-fade { from { opacity: 0; } }
@media (max-width: 599px) {
  .sd-body { font-size: 12px; }
  .sd-io { grid-template-columns: 1fr; gap: 0; }
  .sd-name { font-size: 18px; }
  .sd-hex { --hh: min(90svh, calc(var(--hw) * 2)); }  /* taller on phones; corners keep 30° */
  .sd-frame { left: 6%; right: 6%; top: calc(var(--tip) * 0.34); }
  .sd-close { right: 0; top: 0; }
}
@media (prefers-reduced-motion: reduce) { .sd-overlay, .sd-hex { animation: none; } .sm-edge, .sm-badge { transition: none; } }

/* Scrollbars: never a track; the thumb is white at rest and blue while that element scrolls or the thumb is hovered. */
* { --sb-thumb: #fff; }
.is-scrolling { --sb-thumb: var(--primary); }
::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }

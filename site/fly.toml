# Presentation site at petrogrid.xyz. The simulation app is a separate Fly app (see deploy/).
# Deploy from this folder:  fly deploy

app = "petrogrid-site"
primary_region = "dfw"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"    # sleeps when nobody is visiting; the next visit wakes it
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

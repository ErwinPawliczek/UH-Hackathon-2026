# Static host for the presentation site. Fly terminates TLS and forwards plain HTTP.

server {
  listen 80;
  listen [::]:80;
  server_name www.petrogrid.xyz;
  return 301 https://petrogrid.xyz$request_uri;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # The page is revised often during the event, so browsers must revalidate it.
  add_header Cache-Control "no-cache" always;

  # browsers ask for /favicon.ico by default: give them the mark
  location = /favicon.ico {
    return 302 /favicon.svg;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

# Fly.io deployment for the crx-server (§11, §15.3).
#
# Internal port: 8080 — the binary listens on $CRX_PORT (set below); Fly's
# edge terminates TLS on 443/80 and forwards to internal_port.
#
# Deploy from the repo root so the Docker build context sees engine/, apps/
# and web/. The [build] dockerfile path resolves relative to THIS file's
# folder (deploy/), not the repo root — "deploy/Dockerfile" here makes Fly
# look for deploy/deploy/Dockerfile:
#   fly deploy . --config deploy/fly.toml
# See README.md for the full steps and the custom-domain DNS records.

app = "petrogrid"
primary_region = "dfw"          # Dallas–Fort Worth; demo audience is US-centric

[build]
  dockerfile = "Dockerfile"          # relative to this file's folder → deploy/Dockerfile

[env]
  CRX_PORT = "8080"
  CRX_WEB_DIR = "/app/web/dist"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # demo stays up: no idle stop, no cold starts
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                   # headroom for 16 in-memory sessions

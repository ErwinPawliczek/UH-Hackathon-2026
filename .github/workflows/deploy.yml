# Manual deploy of the hosted demo to Fly.io (§11, §15.3).
#
# Triggered by hand so releases are deliberate. The deploy runs from the repo
# root so the Docker build context sees engine/, apps/ and web/; fly.toml
# governs the machine (one always-on shared-cpu-1x — sessions are in memory,
# so this workflow deliberately passes no scaling flags).
#
# Requires the FLY_API_TOKEN repository secret.

name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy . --config deploy/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
